<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f766e">
<title>Punch</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<style>
:root{
  --bg:#f4f5f2; --card:#ffffff; --ink:#1b1f1d; --muted:#66706b; --line:#e2e5e0;
  --brand:#0f766e; --brand-ink:#ffffff; --in:#16a34a; --out:#dc2626; --warn:#b45309;
  --warn-bg:#fff4e0; --ok-bg:#e6f6ea; --chip:#eef1ec; --shadow:0 1px 2px rgba(0,0,0,.06),0 4px 14px rgba(0,0,0,.05);
}
@media (prefers-color-scheme:dark){:root{
  --bg:#111413; --card:#1b201e; --ink:#eef1ee; --muted:#9aa49f; --line:#2b322f;
  --brand:#2bb3a5; --brand-ink:#06201d; --in:#22c55e; --out:#f05252; --warn:#f0b35a;
  --warn-bg:#2e2416; --ok-bg:#16291c; --chip:#252b28; --shadow:none;
}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
body{padding-bottom:calc(72px + env(safe-area-inset-bottom))}
header{position:sticky;top:0;z-index:5;background:var(--bg);padding:calc(10px + env(safe-area-inset-top)) 16px 8px;display:flex;align-items:center;justify-content:space-between}
header h1{font-size:20px;margin:0;letter-spacing:-.01em}
main{padding:0 16px 24px;max-width:560px;margin:0 auto}
.card{background:var(--card);border-radius:16px;padding:16px;box-shadow:var(--shadow);margin:0 0 12px}
.muted{color:var(--muted)} .small{font-size:13px}
h2{font-size:15px;margin:18px 2px 8px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.04em}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 18px;border-radius:12px;background:var(--chip);font-weight:600}
.btn.primary{background:var(--brand);color:var(--brand-ink)}
.btn.danger{background:transparent;color:var(--out)}
.btn.block{width:100%}
.row{display:flex;gap:8px;align-items:center}
.row > *{flex:1;min-width:0}
.status{text-align:center;padding:22px 16px 18px}
.status .state{font-size:14px;font-weight:700;letter-spacing:.06em;text-transform:uppercase}
.status .state.on{color:var(--in)} .status .state.off{color:var(--muted)}
.status .who{font-size:22px;font-weight:700;margin-top:4px}
.status .since{font-size:15px;color:var(--muted);margin-top:2px}
.status .clock{font-size:44px;font-weight:700;font-variant-numeric:tabular-nums;margin-top:6px;letter-spacing:-.02em}
.punch{display:block;margin:18px auto 6px;width:210px;height:210px;border-radius:50%;color:#fff;font-size:30px;font-weight:800;letter-spacing:.03em;box-shadow:0 10px 30px rgba(0,0,0,.18);transition:transform .08s}
.punch:active{transform:scale(.96)}
.punch.in{background:var(--in)} .punch.out{background:var(--out)}
.punch small{display:block;font-size:14px;font-weight:600;opacity:.9;margin-top:4px;letter-spacing:0}
.punch[disabled]{opacity:.5}
.loc{display:flex;gap:10px;align-items:center;font-size:14px;color:var(--muted);justify-content:center;flex-wrap:wrap}
.dot{width:9px;height:9px;border-radius:50%;background:var(--muted);flex:0 0 auto}
.dot.ok{background:var(--in)} .dot.bad{background:var(--out)}
.clients{display:flex;flex-direction:column;gap:8px}
.client{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:14px;border-radius:14px;background:var(--card);border:2px solid var(--line);min-height:62px}
.client.sel{border-color:var(--brand);background:color-mix(in srgb,var(--brand) 8%,var(--card))}
.client .name{font-weight:700;font-size:17px}
.client .meta{font-size:13px;color:var(--muted)}
.client .radio{width:22px;height:22px;border-radius:50%;border:2px solid var(--line);flex:0 0 auto}
.client.sel .radio{border:7px solid var(--brand)}
.client .grow{flex:1;min-width:0}
.badge{display:inline-block;font-size:11px;font-weight:700;padding:2px 7px;border-radius:999px;background:var(--chip);color:var(--muted);margin-left:4px;vertical-align:2px}
.badge.here{background:var(--ok-bg);color:var(--in)}
.badge.def{background:color-mix(in srgb,var(--brand) 15%,transparent);color:var(--brand)}
.banner{border-radius:14px;padding:12px 14px;margin:0 0 12px;background:var(--warn-bg);color:var(--ink);font-size:14px}
.banner b{color:var(--warn)}
.banner.ok{background:var(--ok-bg)}
.banner .row{margin-top:10px}
.today{display:flex;justify-content:space-around;text-align:center}
.today b{display:block;font-size:20px}
nav{position:fixed;left:0;right:0;bottom:0;z-index:6;display:flex;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;padding:10px 0 9px;font-size:12px;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:3px;min-height:60px}
nav button.on{color:var(--brand);font-weight:700}
nav svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 8px;scrollbar-width:none}
.chip{flex:0 0 auto;padding:9px 14px;border-radius:999px;background:var(--chip);font-size:14px;font-weight:600;min-height:40px}
.chip.on{background:var(--brand);color:var(--brand-ink)}
.day{margin:14px 2px 6px;display:flex;justify-content:space-between;font-size:14px;font-weight:700;color:var(--muted)}
.entry{display:flex;gap:10px;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line);text-align:left;width:100%}
.entry:last-child{border-bottom:0}
.entry .grow{flex:1;min-width:0}
.entry .t{font-weight:700}
.entry .d{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.entry .amt{font-weight:700;text-align:right;white-space:nowrap}
.flags{display:flex;gap:6px;margin-top:4px;justify-content:flex-end}
.flag{font-size:11px;font-weight:700;padding:5px 9px;border-radius:999px;background:var(--chip);color:var(--muted);min-height:28px}
.flag.on.f{background:color-mix(in srgb,var(--warn) 22%,transparent);color:var(--warn)}
.flag.on.p{background:var(--ok-bg);color:var(--in)}
.list{padding:0}
.totals{display:flex;justify-content:space-between;font-weight:700;padding:12px 4px}
label.f{display:block;margin:12px 0 0;font-size:13px;font-weight:600;color:var(--muted)}
input,select,textarea{font:inherit;color:var(--ink);background:var(--bg);border:1.5px solid var(--line);border-radius:10px;padding:12px;width:100%;margin-top:5px;min-height:48px}
textarea{min-height:80px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--brand)}
.switch{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.switch:last-child{border-bottom:0}
.switch input{width:auto;min-height:0;margin:0;transform:scale(1.4)}
.days{display:flex;gap:6px;margin-top:8px}
.days label{flex:1;text-align:center}
.days input{display:none}
.days span{display:block;padding:10px 0;border-radius:10px;background:var(--chip);font-weight:700;font-size:13px}
.days input:checked + span{background:var(--brand);color:var(--brand-ink)}
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--card);width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:20px 20px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom))}
.sheet h3{margin:0 0 4px;font-size:20px}
.sheet .actions{display:flex;gap:8px;margin-top:18px}
.sheet .actions > *{flex:1}
.toast{position:fixed;left:16px;right:16px;top:calc(12px + env(safe-area-inset-top));z-index:30;background:var(--ink);color:var(--bg);padding:13px 16px;border-radius:12px;font-size:14px;text-align:center;max-width:528px;margin:0 auto}
.empty{text-align:center;padding:30px 10px;color:var(--muted)}
.hidden{display:none!important}
.sheet-head{display:flex;align-items:center;justify-content:space-between;gap:8px}
.sheet-head h3{margin:0}
.icon-btn{width:48px;height:48px;border-radius:12px;display:inline-flex;align-items:center;justify-content:center;color:var(--out);flex:0 0 auto}
.icon-btn svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.entry{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.entry.sel{background:color-mix(in srgb,var(--brand) 14%,transparent)}
.entry .check{width:24px;height:24px;border-radius:50%;border:2px solid var(--line);flex:0 0 auto;display:flex;align-items:center;justify-content:center;font-size:14px;color:var(--brand-ink)}
.entry.sel .check{background:var(--brand);border-color:var(--brand)}
.selbar{position:fixed;left:0;right:0;bottom:calc(60px + env(safe-area-inset-bottom));z-index:7;background:var(--card);border-top:1px solid var(--line);box-shadow:0 -4px 14px rgba(0,0,0,.08);padding:10px 16px}
.selbar .top{display:flex;justify-content:space-between;align-items:center;gap:8px;font-weight:700;margin-bottom:8px;font-size:15px}
.selbar .grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.selbar .btn{min-height:44px}
body.selecting{padding-bottom:calc(200px + env(safe-area-inset-bottom))}
.summary{display:flex;justify-content:space-around;text-align:center}
.summary b{display:block;font-size:18px}
.unbilled{display:flex;align-items:center;gap:12px;width:100%;text-align:left}
.unbilled .grow{flex:1}
</style>
</head>
<body>
<header><h1 id="title">Punch</h1><span id="hdr" class="small muted"></span></header>
<main id="view"></main>
<nav id="nav">
  <button data-tab="punch" class="on"><svg viewBox="0 0 24 24"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l2.5 2.5M9 2h6"/></svg>Punch</button>
  <button data-tab="history"><svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h10"/></svg>Historique</button>
  <button data-tab="clients"><svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.8-3.5 3.4-5.5 6.5-5.5s5.7 2 6.5 5.5M16 4.5a3.5 3.5 0 0 1 0 7M18 14.8c1.8.8 3 2.5 3.5 5.2"/></svg>Clients</button>
  <button data-tab="settings"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>Réglages</button>
</nav>
<div id="sheet" class="hidden"></div>
<div id="toast" class="toast hidden"></div>
<input type="file" id="restoreFile" accept=".json,application/json,text/plain,application/octet-stream" class="hidden">

<script>
/* Affiche toute erreur à l'écran plutôt qu'un écran vide */
window.addEventListener("error", function(e){
  var d = document.getElementById("fatal") || document.body.appendChild(Object.assign(document.createElement("div"), {id: "fatal"}));
  d.style.cssText = "position:fixed;left:8px;right:8px;top:8px;z-index:99;background:#b91c1c;color:#fff;padding:12px;border-radius:10px;font:13px/1.4 system-ui";
  d.textContent = "Erreur : " + (e.message || e) + " (ligne " + (e.lineno || "?") + "). Faites une capture et envoyez-la.";
});
</script>
<script src="capacitor.js"></script>
<script>
"use strict";
/* ============ Stockage ============ */
const KEY = "punch.v1";
const DEFAULT_SETTINGS = {
  radiusKm: 2, clientRadiusM: 300, leaveMode: "ask", home: null,
  remindStart: true, startTime: "08:30", days: [1,2,3,4,5],
  remindEnd: true, endTime: "18:00", maxHours: 10, arrival: false
};
function load(){
  let s = null;
  try { s = JSON.parse(localStorage.getItem(KEY)); } catch(e) {}
  s = s || {};
  return {
    clients: s.clients || [], entries: s.entries || [], active: s.active || null,
    lastLoc: s.lastLoc || null, notified: s.notified || {}, lastClientId: s.lastClientId || null,
    settings: Object.assign({}, DEFAULT_SETTINGS, s.settings || {}),
    seenIntro: !!s.seenIntro, setupSeen: !!s.setupSeen, backupName: s.backupName || null
  };
}
let S = load();
function save(){ try { localStorage.setItem(KEY, JSON.stringify(S)); } catch(e) { toast("Impossible d'enregistrer : " + e.message); } syncWidget(); autoBackup(); if (typeof syncClientFences === "function" && startedServices) syncClientFences(); }

/* ============ Plateforme ============ */
const CAP = window.Capacitor;
const NATIVE = !!(CAP && CAP.isNativePlatform && CAP.isNativePlatform());
function plugin(name){
  try {
    const reg = (window.capacitorExports && window.capacitorExports.registerPlugin) || (CAP && CAP.registerPlugin);
    return reg ? reg(name) : (CAP && CAP.Plugins && CAP.Plugins[name]) || null;
  } catch(e) { console.error("Plugin " + name, e); return null; }
}
const BG = NATIVE ? plugin("BackgroundGeolocation") : null;
const LN = NATIVE ? plugin("LocalNotifications") : null;
const FS = NATIVE ? plugin("Filesystem") : null;
const SHARE = NATIVE ? plugin("Share") : null;
const PN = NATIVE ? plugin("PunchNative") : null;

/* ============ Utilitaires ============ */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,7);
const money = n => new Intl.NumberFormat("fr-CA",{style:"currency",currency:"CAD"}).format(n || 0);
const pad = n => String(n).padStart(2,"0");
const hm = t => { const d = new Date(t); return pad(d.getHours()) + ":" + pad(d.getMinutes()); };
const ymd = t => { const d = new Date(t); return d.getFullYear() + "-" + pad(d.getMonth()+1) + "-" + pad(d.getDate()); };
const dayLabel = t => new Date(t).toLocaleDateString("fr-CA",{weekday:"long",day:"numeric",month:"long"});
const dur = ms => { const m = Math.max(0, Math.round(ms/60000)); return Math.floor(m/60) + " h " + pad(m%60); };
/* Heures en décimal, arrondies à la minute comme l'affichage h/min : 25 h 45 → 25.75 h */
const dec = hrs => (Math.round(hrs * 60) / 60).toFixed(2) + " h";
const hoursOf = e => Math.max(0, ((e.end || Date.now()) - e.start) / 3600000);
const totalOf = e => hoursOf(e) * (Number(e.rate) || 0) + (Number(e.material) || 0);
const toLocalInput = t => { const d = new Date(t); return ymd(t) + "T" + pad(d.getHours()) + ":" + pad(d.getMinutes()); };
const fromLocalInput = v => v ? new Date(v).getTime() : null;
const toDateInput = t => ymd(t);
const toTimeInput = t => hm(t);
/* Lecture souple de ce que l'utilisateur tape : « 1330 », « 13:30 », « 13h30 », « 930 » ; « 2026-10-13 », « 20261013 », « 13/10/2026 » */
function parseTime(v){
  v = String(v || "").trim().toLowerCase().replace(/\s/g, "");
  let m = v.match(/^(\d{1,2})[:h.](\d{1,2})?$/) || v.match(/^(\d{1,2})(\d{2})$/) || v.match(/^(\d{1,2})$/);
  if (!m) return null;
  const h = +m[1], mi = m[2] === undefined ? 0 : +m[2];
  return h <= 23 && mi <= 59 ? pad(h) + ":" + pad(mi) : null;
}
function parseDate(v){
  v = String(v || "").trim();
  let m = v.match(/^(\d{4})[-/.]?(\d{1,2})[-/.]?(\d{1,2})$/), y, mo, d;
  if (m) { y = +m[1]; mo = +m[2]; d = +m[3]; }
  else if ((m = v.match(/^(\d{1,2})[-/.](\d{1,2})[-/.](\d{4})$/))) { d = +m[1]; mo = +m[2]; y = +m[3]; }
  else return null;
  const t = new Date(y, mo - 1, d);
  return t.getFullYear() === y && t.getMonth() === mo - 1 && t.getDate() === d ? ymd(t.getTime()) : null;
}
function fromDateTime(d, t){
  d = parseDate(d); t = parseTime(t);
  if (!d || !t) return null;
  const [y,m,dd] = d.split("-").map(Number), [h,mi] = t.split(":").map(Number);
  const x = new Date(y, m-1, dd, h, mi, 0, 0).getTime(); return isNaN(x) ? null : x;
}
/* Champs date + heure (IN et OUT) : saisie au clavier numérique, calendrier en option */
function dtRow(prefix, t){
  return `<div class="row" style="gap:6px">
    <input id="${prefix}D" type="text" inputmode="numeric" autocomplete="off" placeholder="AAAA-MM-JJ" maxlength="10" value="${toDateInput(t)}">
    <button class="btn" style="flex:0 0 48px;padding:0" data-act="pickDate" data-id="${prefix}D" aria-label="Calendrier">📅</button>
    <input id="${prefix}T" type="text" inputmode="numeric" autocomplete="off" placeholder="HH:MM" maxlength="5" value="${toTimeInput(t)}" style="flex:0 0 84px;text-align:center;font-weight:700">
  </div>`;
}
function timeFields(start, end){
  return `<div class="card" style="background:var(--bg);box-shadow:none;padding:12px;margin-top:12px">
    <div style="font-weight:700">Punch IN</div>
    ${dtRow("eStart", start)}
    ${end !== undefined ? `<div style="font-weight:700;margin-top:12px">Punch OUT</div>
    ${dtRow("eEnd", end)}
    <div id="eDur" class="small muted" style="margin-top:8px"></div>` : ""}
    <div class="small muted" style="margin-top:6px">Tapez l'heure, ex. 1330 pour 13:30.</div>
  </div>`;
}
/* Mise en forme pendant la frappe : ajoute « : » et « - » automatiquement */
function maskTime(el){
  const digits = el.value.replace(/\D/g, "").slice(0, 4);
  el.value = digits.length > 2 ? digits.slice(0, digits.length - 2) + ":" + digits.slice(-2) : digits;
}
function maskDate(el){
  const d = el.value.replace(/\D/g, "").slice(0, 8);
  el.value = d.length > 6 ? d.slice(0,4) + "-" + d.slice(4,6) + "-" + d.slice(6) : d.length > 4 ? d.slice(0,4) + "-" + d.slice(4) : d;
}
function bindTimeFields(){
  const sd = $("#eStartD"), ed = $("#eEndD"), info = $("#eDur");
  if (!sd) return;
  let lastStartD = parseDate(sd.value);
  const mark = el => { const ok = el.id.endsWith("T") ? parseTime(el.value) : parseDate(el.value); el.style.borderColor = el.value && !ok ? "var(--out)" : ""; };
  const upd = () => {
    if (!info) return;
    const a = fromDateTime(val("eStartD"), val("eStartT")), b = fromDateTime(val("eEndD"), val("eEndT"));
    if (!a || !b) { info.textContent = ""; return; }
    info.innerHTML = b > a ? "Durée : <b>" + dur(b - a) + "</b> (" + dec((b - a) / 3600000) + ")" : "<span style=\"color:var(--out)\">Le OUT doit être après le IN</span>";
  };
  // Changer la date du IN déplace aussi la date du OUT du même nombre de jours
  const startDateChanged = () => {
    const nd = parseDate(sd.value);
    if (ed && lastStartD && nd && parseDate(ed.value) && nd !== lastStartD) {
      const shift = new Date(nd + "T00:00") - new Date(lastStartD + "T00:00");
      ed.value = ymd(new Date(parseDate(ed.value) + "T00:00").getTime() + shift);
    }
    if (nd) lastStartD = nd;
  };
  ["eStartD","eStartT","eEndD","eEndT"].forEach(id => {
    const el = $("#" + id); if (!el) return;
    const isT = id.endsWith("T");
    el.addEventListener("focus", () => setTimeout(() => el.select(), 0));
    el.addEventListener("input", ev => {
      if (!(ev.inputType || "").startsWith("delete")) (isT ? maskTime : maskDate)(el);
      if (id === "eStartD") startDateChanged();
      mark(el); upd();
    });
    el.addEventListener("change", () => { const n = isT ? parseTime(el.value) : parseDate(el.value); if (n) el.value = n; if (id === "eStartD") startDateChanged(); mark(el); upd(); });
  });
  upd();
}
/* Calendrier natif en option (bouton 📅) */
function pickDate(targetId){
  const target = $("#" + targetId); if (!target) return;
  const tmp = document.createElement("input");
  tmp.type = "date"; tmp.value = parseDate(target.value) || ymd(Date.now());
  tmp.style.cssText = "position:fixed;left:50%;top:50%;opacity:0;width:1px;height:1px";
  document.body.appendChild(tmp);
  tmp.addEventListener("change", () => { if (tmp.value) { target.value = tmp.value; target.dispatchEvent(new Event("change")); } tmp.remove(); });
  tmp.addEventListener("blur", () => setTimeout(() => tmp.remove(), 500));
  try { tmp.showPicker(); } catch(e) { tmp.focus(); tmp.click(); }
}
const clientById = id => S.clients.find(c => c.id === id);
function distM(a, b){
  if(!a || !b) return Infinity;
  const R = 6371000, r = x => x * Math.PI / 180;
  const dLat = r(b.lat - a.lat), dLng = r(b.lng - a.lng);
  const h = Math.sin(dLat/2)**2 + Math.cos(r(a.lat))*Math.cos(r(b.lat))*Math.sin(dLng/2)**2;
  return 2 * R * Math.asin(Math.sqrt(h));
}
const fmtDist = m => m < 1000 ? Math.round(m/10)*10 + " m" : (m/1000).toFixed(1).replace(".", ",") + " km";
let toastTimer;
function toast(msg, ms = 3500){ const t = $("#toast"); t.textContent = msg; t.classList.remove("hidden"); clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.add("hidden"), ms); }

/* ============ Position ============ */
let locError = null, webWatch = null, nativeWatch = null, nativeWatchKey = null;
const locFresh = (maxAgeMs = 120000) => S.lastLoc && Date.now() - S.lastLoc.time < maxAgeMs;

function onLocation(p){
  locError = null;
  S.lastLoc = { lat: p.lat, lng: p.lng, acc: p.acc || 0, time: p.time || Date.now() };
  checkZone();
  checkArrival();
  save();
  if (current === "punch" && !sheetOpen()) renderPunch(true);
}
function onLocError(code, msg){
  locError = code === 1 || code === "NOT_AUTHORIZED" ? "denied" : "error";
  if (current === "punch" && !sheetOpen()) renderPunch(true);
  if (code === "NOT_AUTHORIZED" && BG && confirm("L'app a besoin de votre position. Ouvrir les réglages ?")) BG.openSettings();
}

function startWebWatch(){
  if (NATIVE || webWatch !== null || !navigator.geolocation) return;
  webWatch = navigator.geolocation.watchPosition(
    p => onLocation({lat:p.coords.latitude, lng:p.coords.longitude, acc:p.coords.accuracy, time:p.timestamp}),
    e => onLocError(e.code, e.message),
    {enableHighAccuracy: true, maximumAge: 5000, timeout: 30000});
}
function stopWebWatch(){ if (webWatch !== null){ navigator.geolocation.clearWatch(webWatch); webWatch = null; } }

/* Natif : un seul observateur, en arrière-plan (avec notification) quand on est en service */
/* Natif : position seulement quand l'app est à l'écran. En arrière-plan, c'est Android qui surveille
   la zone (géorepérage), sans GPS continu : beaucoup moins de batterie. */
async function syncNativeWatch(){
  if (!NATIVE) return;
  const key = document.visibilityState === "visible" ? "fg" : null;
  if (key === nativeWatchKey) return;
  if (nativeWatch) { try { await BG.removeWatcher({id: nativeWatch}); } catch(e) {} nativeWatch = null; }
  nativeWatchKey = key;
  if (!key) return;
  try {
    nativeWatch = await BG.addWatcher({ requestPermissions: false, stale: false, distanceFilter: 25 }, (loc, err) => {
      if (err) return onLocError(err.code, err.message);
      if (loc) onLocation({lat: loc.latitude, lng: loc.longitude, acc: loc.accuracy, time: loc.time});
    });
  } catch(e) { nativeWatchKey = null; onLocError("error", e.message); }
}

/* ============ Zone native (géorepérage Android) ============ */
function syncZone(){
  if (!PN) return;
  const a = S.active;
  if (!a) { PN.stopZone().catch(() => {}); return; }
  if (a.leftPending || a.travelUntil) return;   // zone déjà retirée par Android
  if (!a.startLoc) { PN.stopZone().catch(() => {}); return; }
  PN.startZone({ client: a.clientName, start: a.start, lat: a.startLoc.lat, lng: a.startLoc.lng,
                 radius: S.settings.radiusKm * 1000, mode: S.settings.leaveMode }).catch(() => {});
}
/* Lit ce qu'Android a détecté pendant que l'app était fermée */
async function applyZoneState(){
  if (!PN) return;
  let r; try { r = await PN.getZoneState(); } catch(e) { return; }
  zoneError = r.active ? (r.error || "") : "";
  const a = S.active;
  if (!a) { if (r.active) PN.stopZone().catch(() => {}); return; }
  let changed = false;
  if (r.recentered && r.lat) {
    a.startLoc = { lat: +r.lat, lng: +r.lng }; a.travelUntil = null; a.lastInsideAt = r.recentered; changed = true;
  }
  if (r.leftTime && !a.leftPending && !a.travelUntil) {
    a.leftPending = { at: Math.max(a.start, r.leftTime), d: S.settings.radiusKm * 1000 }; changed = true;
  }
  if (r.leftTime || r.recentered) PN.clearLeft().catch(() => {});
  if (changed) save();
  if (!r.active && !a.leftPending && !a.travelUntil) syncZone();   // ex. première ouverture après la mise à jour
  if (a.leftPending) {
    if (S.settings.leaveMode === "auto") { punchOut(a.leftPending.at, {auto: true}); return; }
    if (document.visibilityState === "visible") askLeftZone();
  }
  if (current === "punch" && !sheetOpen()) renderPunch(true);
}
let lastClientsSig = null, zoneError = "";
function zoneErrorText(){
  if (!zoneError) return "";
  if (/1004|permission/i.test(zoneError)) return "Android n'a pas l'autorisation « Position : toujours autoriser ».";
  if (/1000|not.?available/i.test(zoneError)) return "Activez <b>Paramètres › Localisation › Services de localisation › Précision de la localisation Google</b>.";
  return "Erreur Android : " + esc(zoneError);
}
function syncClientFences(){
  if (!PN) return;
  const list = S.clients.filter(c => c.lat != null).map(c => ({ id: c.id, name: c.name, lat: c.lat, lng: c.lng }));
  const sig = JSON.stringify([list, S.settings.arrival, S.settings.clientRadiusM]);
  if (sig === lastClientsSig) return;
  lastClientsSig = sig;
  PN.setClients({ clients: JSON.stringify(list), radius: S.settings.clientRadiusM, enabled: !!S.settings.arrival }).catch(() => {});
}

function syncWatch(){ if (NATIVE && !startedServices && !S.active) return; NATIVE ? syncNativeWatch() : (document.visibilityState === "visible" ? startWebWatch() : stopWebWatch()); }

/* Position actuelle (une fois), avec délai */
function currentPosition(timeoutMs = 10000){
  return new Promise(resolve => {
    if (locFresh(60000)) return resolve(S.lastLoc);
    let done = false;
    const finish = v => { if (!done){ done = true; resolve(v); } };
    setTimeout(() => finish(S.lastLoc && locFresh(600000) ? S.lastLoc : null), timeoutMs);
    if (NATIVE) {
      let id;
      BG.addWatcher({requestPermissions: true, stale: true}, (loc) => {
        if (loc) { onLocation({lat: loc.latitude, lng: loc.longitude, acc: loc.accuracy, time: loc.time}); finish(S.lastLoc); }
        if (id) BG.removeWatcher({id}).catch(()=>{});
      }).then(x => { id = x; if (done) BG.removeWatcher({id}).catch(()=>{}); }).catch(() => finish(null));
    } else if (navigator.geolocation) {
      navigator.geolocation.getCurrentPosition(
        p => { onLocation({lat:p.coords.latitude, lng:p.coords.longitude, acc:p.coords.accuracy, time:p.timestamp}); finish(S.lastLoc); },
        e => { onLocError(e.code); finish(null); },
        {enableHighAccuracy: true, maximumAge: 5000, timeout: timeoutMs});
    } else finish(null);
  });
}

/* ============ Zone 2 km ============ */
function checkZone(){
  if (NATIVE) return;   // sur Android, la sortie de zone est détectée par le système
  const a = S.active, L = S.lastLoc;
  if (!a || !a.startLoc || !L) return;
  // Mode déplacement : la zone suit, puis se recentre là où vous serez
  if (a.travelUntil) {
    a.lastInsideAt = Math.max(a.lastInsideAt || 0, L.time);
    if (L.time < a.travelUntil) return;
    a.startLoc = { lat: L.lat, lng: L.lng }; a.travelUntil = null; a.outCount = 0;
    return;
  }
  const radius = S.settings.radiusKm * 1000;
  const d = distM(a.startLoc, L);
  const slack = Math.min(L.acc || 0, 300);
  if (d - slack <= radius) {
    a.lastInsideAt = Math.max(a.lastInsideAt || 0, L.time); a.outCount = 0;
    if (a.leftPending) { a.leftPending = null; cancelNotifs([2004]); if (sheetKind === "left") closeSheet(); }
    return;
  }
  const mode = S.settings.leaveMode;
  if (mode === "off" || (L.acc || 0) > 1500 || a.leftPending) return;
  a.outCount = (a.outCount || 0) + 1;
  if (a.outCount < 2 && d < radius * 2) return;   // éviter un saut GPS isolé
  const lastIn = Math.max(a.lastInsideAt || a.start, a.start);
  if (mode === "auto" && (NATIVE || Date.now() - lastIn < 15 * 60000)) {
    punchOut(lastIn, {auto: true});
    return;
  }
  // Demander : punch OUT, changer de client ou déplacement
  a.leftPending = { at: lastIn, d };
  save();
  notify(2004, "Vous avez quitté la zone de " + S.settings.radiusKm + " km",
         a.clientName + " : punch OUT, changer de client ou déplacement ?", "LEFT_ZONE");
  if (document.visibilityState === "visible") askLeftZone();
}

/* ============ Détection d'arrivée ============ */
function nearbyClients(){
  const L = S.lastLoc;
  if (!L || !locFresh(600000)) return [];
  return S.clients.filter(c => c.lat != null)
    .map(c => ({c, d: distM(c, L)}))
    .filter(x => x.d <= Math.max(S.settings.clientRadiusM, (L.acc || 0)))
    .sort((a,b) => a.d - b.d);
}
const atHome = () => S.settings.home && S.lastLoc && locFresh(600000) && distM(S.settings.home, S.lastLoc) <= Math.max(300, S.lastLoc.acc || 0);
function checkArrival(){
  return;   // arrivée chez un client : détectée par Android (géorepérage)
  if (S.active || !NATIVE || !S.settings.arrival) return;
  const n = nearbyClients()[0];
  if (!n) return;
  const today = ymd(Date.now());
  if (S.notified[n.c.id] === today) return;
  S.notified[n.c.id] = today;
  notify(3000, "Vous êtes chez " + n.c.name, "Puncher IN maintenant ?", "PUNCH_IN", {clientId: n.c.id});
}

/* ============ Punch ============ */
let selectedClientId = null, userPicked = false;
function suggestedClientId(){
  const near = nearbyClients()[0];
  if (near) return near.c.id;
  const def = S.clients.find(c => c.isDefault);
  if (def) return def.id;
  if (S.lastClientId && clientById(S.lastClientId)) return S.lastClientId;
  return S.clients[0] ? S.clients[0].id : null;
}

let punching = false;
async function punchIn(clientId, opts = {}){
  if (S.active || punching) return;
  const c = clientById(clientId);
  if (!c) return toast("Choisissez un client");
  punching = true; renderPunch();
  const loc = await currentPosition(8000);
  punching = false;
  if (S.active) return render();
  S.active = { id: uid(), clientId: c.id, clientName: c.name, rate: Number(c.rate) || 0, start: opts.start || Date.now(),
               startLoc: loc ? {lat: loc.lat, lng: loc.lng} : null, lastInsideAt: Date.now(), outCount: 0 };
  S.lastClientId = c.id; userPicked = false;
  save();
  toast(loc ? "Punch IN chez " + c.name + " ✓" : "Punch IN ✓ — sans position, pas de punch out automatique", 4500);
  if (navigator.vibrate) navigator.vibrate(60);
  if (NATIVE) await notifReady();   // Android 13+ : requis pour la notification « En service »
  syncZone();
  setTimeout(applyZoneState, 4000);
  syncWatch();
  scheduleShiftReminders();
  scheduleStartReminders();
  render();
}

function punchOut(end, opts = {}){
  const a = S.active;
  if (!a) return;
  end = Math.max(a.start, end || Date.now());
  const e = { id: a.id, clientId: a.clientId, clientName: a.clientName, rate: a.rate, start: a.start, end,
              desc: "", material: 0, billed: false, paid: false, auto: !!opts.auto, switched: !!opts.switched, review: true };
  S.entries.push(e);
  S.active = null;
  save();
  cancelNotifs([2001, 2002, 2004]);
  if (PN) { PN.stopZone().catch(() => {}); PN.clearLeft().catch(() => {}); }
  if (opts.switched) { save(); return e; }
  syncWatch();
  scheduleStartReminders();
  if (navigator.vibrate) navigator.vibrate([60,60,60]);
  if (opts.auto) {
    notify(2003, "Punch OUT automatique", (e.clientName) + " : fin à " + hm(end) + " (" + dur(end - e.start) + "). Vous avez quitté la zone de " + S.settings.radiusKm + " km.");
    render();
  } else {
    render();
    openEntry(e.id, true);
  }
}

/* ============ Notifications (natif) ============ */
async function notifReady(){
  if (!LN) return false;
  try {
    let p = await LN.checkPermissions();
    if (p.display !== "granted") p = await LN.requestPermissions();
    return p.display === "granted";
  } catch(e) { return false; }
}
async function notify(id, title, body, actionTypeId, extra, at){
  if (!LN) return;
  if (!(await notifReady())) return;
  const n = { id, title, body, extra: extra || null, schedule: { at: new Date(at || Date.now() + 1000), allowWhileIdle: true } };
  if (actionTypeId) n.actionTypeId = actionTypeId;
  try { await LN.schedule({notifications: [n]}); } catch(e) {}
}
async function cancelNotifs(ids){ if (LN) try { await LN.cancel({notifications: ids.map(id => ({id}))}); } catch(e) {} }

function atTime(base, hhmm){ const [h,m] = hhmm.split(":").map(Number); const d = new Date(base); d.setHours(h, m, 0, 0); return d.getTime(); }

async function scheduleShiftReminders(){
  if (!LN || !S.active) return;
  const a = S.active, name = a.clientName, st = S.settings;
  await cancelNotifs([2001, 2002]);
  const maxAt = a.start + st.maxHours * 3600000;
  if (st.maxHours > 0 && maxAt > Date.now()) notify(2001, "Toujours en service ?", "Punché chez " + name + " depuis " + st.maxHours + " h. Oublié de puncher OUT ?", "PUNCH_OUT", null, maxAt);
  if (st.remindEnd) {
    const endAt = atTime(Date.now(), st.endTime);
    if (endAt > Date.now()) notify(2002, "Fin de journée ?", "Vous êtes encore punché chez " + name + ".", "PUNCH_OUT", null, endAt);
  }
}
async function scheduleStartReminders(){
  if (!LN) return;
  const ids = Array.from({length: 14}, (_, i) => 1000 + i);
  await cancelNotifs(ids);
  const st = S.settings;
  if (!st.remindStart) return;
  if (!(await notifReady())) return;
  const today = ymd(Date.now());
  const workedToday = S.active || S.entries.some(e => ymd(e.start) === today);
  const list = [];
  for (let i = 0; i < 14; i++) {
    const d = new Date(); d.setDate(d.getDate() + i);
    if (!st.days.includes(d.getDay())) continue;
    const at = atTime(d, st.startTime);
    if (at <= Date.now() || (i === 0 && workedToday)) continue;
    list.push({ id: 1000 + i, title: "Avez-vous punché IN ?", body: "Touchez pour choisir votre client.", actionTypeId: "PUNCH_IN",
                schedule: { at: new Date(at), allowWhileIdle: true } });
  }
  if (list.length) try { await LN.schedule({notifications: list}); } catch(e) {}
}
async function initNotifications(){
  if (!LN) return;
  try {
    await LN.registerActionTypes({ types: [
      { id: "PUNCH_IN", actions: [{ id: "in", title: "Puncher IN" }] },
      { id: "PUNCH_OUT", actions: [{ id: "out", title: "Puncher OUT" }, { id: "still", title: "Je travaille encore" }] },
      { id: "LEFT_ZONE", actions: [{ id: "leftOut", title: "Puncher OUT" }, { id: "leftSwitch", title: "Changer de client" }, { id: "leftTravel", title: "Déplacement" }] }
    ]});
    LN.addListener("localNotificationActionPerformed", ev => {
      const act = ev.actionId, n = ev.notification || {}, extra = n.extra || {};
      if (act === "in") { punchIn(extra.clientId || suggestedClientId()); }
      else if (act === "out") { if (S.active) punchOut(Date.now()); }
      else if (act === "leftOut") { if (S.active) punchOut(S.active.leftPending ? S.active.leftPending.at : Date.now()); }
      else if (act === "leftTravel") { startTravel(60); }
      else if (act === "leftSwitch" || n.id === 2004) { go("punch"); askLeftZone(); }
      else if (act === "still") { notify(2002, "Toujours en service ?", "Rappel dans une heure.", "PUNCH_OUT", null, Date.now() + 3600000); }
      else if (extra.clientId) { selectedClientId = extra.clientId; userPicked = true; go("punch"); }
    });
  } catch(e) {}
  scheduleStartReminders();
  if (S.active) scheduleShiftReminders();
}

function locLine(){

/* ---- Historique ---- */
let histFilter = "all", histPeriod = "month", histClient = "all";
let selMode = false, selIds = new Set();
function periodRange(){
  const now = new Date();
  if (histPeriod === "month") return [new Date(now.getFullYear(), now.getMonth(), 1).getTime(), Infinity];
  if (histPeriod === "last") return [new Date(now.getFullYear(), now.getMonth()-1, 1).getTime(), new Date(now.getFullYear(), now.getMonth(), 1).getTime()];
  if (histPeriod === "week") { const d = new Date(now); d.setHours(0,0,0,0); d.setDate(d.getDate() - ((d.getDay()+6)%7)); return [d.getTime(), Infinity]; }
  return [0, Infinity];
}
function filteredEntries(){
  const [a, b] = periodRange();
  return S.entries.filter(e => e.start >= a && e.start < b).filter(e => histClient === "all" || e.clientId === histClient).filter(e =>
    histFilter === "all" ? true : histFilter === "tobill" ? !e.billed : histFilter === "unpaid" ? (e.billed && !e.paid) : e.paid
  ).sort((x,y) => y.start - x.start);
}
function unbilledFor(clientId){
  const l = S.entries.filter(e => e.clientId === clientId && !e.billed);
  return { n: l.length, hrs: l.reduce((x,e) => x + hoursOf(e), 0), amt: l.reduce((x,e) => x + totalOf(e), 0) };
}
function renderHistory(){
  $("#title").textContent = "Historique"; $("#hdr").textContent = "";
  const list = filteredEntries();
  if (histClient !== "all" && !clientById(histClient) && !S.entries.some(e => e.clientId === histClient)) histClient = "all";
  const known = new Map(S.clients.map(c => [c.id, c.name]));
  S.entries.forEach(e => { if (!known.has(e.clientId)) known.set(e.clientId, e.clientName + " (supprimé)"); });
  const opts = [...known].sort((x,y) => x[1].localeCompare(y[1], "fr")).map(([id,n]) => `<option value="${esc(id)}" ${histClient === id ? "selected" : ""}>${esc(n)}</option>`).join("");
  let h = `<select id="histClient" style="margin:0 0 8px"><option value="all">Tous les clients</option>${opts}</select>
    <div class="chips">${[["week","Semaine"],["month","Ce mois"],["last","Mois dernier"],["allp","Tout"]].map(([k,l]) => `<button class="chip ${histPeriod === (k === "allp" ? "all" : k) ? "on" : ""}" data-act="period" data-id="${k === "allp" ? "all" : k}">${l}</button>`).join("")}</div>
    <div class="chips">${[["all","Toutes"],["tobill","À facturer"],["unpaid","Facturé, non payé"],["paid","Payé"]].map(([k,l]) => `<button class="chip ${histFilter === k ? "on" : ""}" data-act="filter" data-id="${k}">${l}</button>`).join("")}</div>`;
  if (list.length) {
    const tot = list.reduce((x,e) => x + totalOf(e), 0), hrs = list.reduce((x,e) => x + hoursOf(e), 0);
    h += `<div class="card summary"><div><b>${dur(hrs*3600000)}</b><span class="small muted">${dec(hrs)}</span></div><div><b>${money(tot)}</b><span class="small muted">montant</span></div><div><b>${list.length}</b><span class="small muted">entrées</span></div></div>`;
    if (!selMode) h += `<div class="small muted" style="margin:-4px 4px 4px">Appui long sur une entrée pour en sélectionner plusieurs.</div>`;
  } else h += `<div class="card empty">Aucune entrée pour cette sélection.</div>`;
  let lastDay = null, group = [];
  const flush = () => {
    if (!group.length) return;
    const tot = group.reduce((x,e) => x + totalOf(e), 0), hrs = group.reduce((x,e) => x + hoursOf(e), 0);
    h += `<div class="day"><span>${esc(dayLabel(group[0].start))}</span><span>${dur(hrs*3600000)} (${dec(hrs)}) · ${money(tot)}</span></div><div class="card list">` +
      group.map(e => `<div class="entry ${selIds.has(e.id) ? "sel" : ""}" data-entry="${e.id}">
        ${selMode ? `<span class="check">${selIds.has(e.id) ? "✓" : ""}</span>` : ""}
        <button class="grow" style="text-align:left" data-act="openEntry" data-id="${e.id}">
          <div class="t">${esc(e.clientName)}${e.auto ? ` <span class="badge">auto</span>` : ""}</div>
          <div class="d">${hm(e.start)}–${hm(e.end)} · ${dur(e.end - e.start)}${e.material ? " · mat. " + money(e.material) : ""}${e.desc ? " · " + esc(e.desc) : ""}</div></button>
        <div><div class="amt">${money(totalOf(e))}</div><div class="flags">
          <button class="flag f ${e.billed ? "on" : ""}" data-act="toggleBilled" data-id="${e.id}">${e.billed ? "Facturé" : "Non fact."}</button>
          <button class="flag p ${e.paid ? "on" : ""}" data-act="togglePaid" data-id="${e.id}">${e.paid ? "Payé" : "Non payé"}</button></div></div></div>`).join("") + `</div>`;
    group = [];
  };
  for (const e of list) { const d = ymd(e.start); if (d !== lastDay) { flush(); lastDay = d; } group.push(e); }
  flush();
  if (!selMode) h += `<div class="row" style="margin-top:12px"><button class="btn" data-act="newEntry">+ Entrée manuelle</button><button class="btn primary" data-act="exportCsv">Exporter (Calc)</button></div>`;
  $("#view").innerHTML = h;
  renderSelBar();
}

function renderSelBar(){

function enterSelection(id){
  selMode = true; selIds = new Set(id ? [id] : []);
  if (navigator.vibrate) navigator.vibrate(30);
  guardOn(); renderHistory();
}
function exitSelection(){ selMode = false; selIds.clear(); renderSelBar(); guardOff(); if (current === "history") renderHistory(); }
function toggleSel(id){ selIds.has(id) ? selIds.delete(id) : selIds.add(id); renderHistory(); }
function applySel(kind){
  const l = S.entries.filter(e => selIds.has(e.id));
  if (!l.length) return;
  l.forEach(e => {
    if (kind === "billed") e.billed = true;
    if (kind === "unbilled") { e.billed = false; e.paid = false; }
    if (kind === "paid") { e.paid = true; e.billed = true; }
    if (kind === "unpaid") e.paid = false;
  });
  save();
  const label = { billed: "facturées", unbilled: "non facturées", paid: "payées", unpaid: "non payées" }[kind];
  toast(l.length + " entrée" + (l.length > 1 ? "s" : "") + " marquée" + (l.length > 1 ? "s" : "") + " " + label + " ✓");
  exitSelection();
}
/* Appui long : 500 ms sans bouger */
(function(){
  let timer = null, startX = 0, startY = 0, fired = false;
  const view = document.getElementById("view");
  view.addEventListener("pointerdown", ev => {
    const row = ev.target.closest(".entry[data-entry]");
    if (!row || current !== "history") return;
    fired = false; startX = ev.clientX; startY = ev.clientY;
    clearTimeout(timer);
    timer = setTimeout(() => { fired = true; const id = row.dataset.entry; selMode ? toggleSel(id) : enterSelection(id); }, 500);
  });
  const cancel = () => clearTimeout(timer);
  view.addEventListener("pointermove", ev => { if (Math.abs(ev.clientX - startX) > 10 || Math.abs(ev.clientY - startY) > 10) cancel(); });
  view.addEventListener("pointerup", cancel);
  view.addEventListener("pointercancel", cancel);
  view.addEventListener("contextmenu", ev => { if (ev.target.closest(".entry")) ev.preventDefault(); });
  // Le clic qui suit un appui long ne doit pas ouvrir l'entrée
  view.addEventListener("click", ev => { if (fired) { fired = false; ev.stopPropagation(); ev.preventDefault(); } }, true);
})();

/* ============ Fiches (sheets) ============ */
/* Bouton « retour » d'Android : ferme la fiche ouverte (comme Annuler) ou quitte la sélection.
   Une entrée d'historique sert de garde tant qu'une fiche ou une sélection est ouverte. */
let guard = false, ignorePop = false, pendingPush = false;
function guardOn(){
  if (NATIVE || guard) return;   // sur Android, le bouton retour passe par window.punchBack

  if (ignorePop) { pendingPush = true; return; }
  try { history.pushState({ punch: 1 }, ""); guard = true; } catch(e) {}
}
function guardOff(){
  if (NATIVE || !guard || sheetOpen() || selMode) return;
  guard = false; ignorePop = true;
  try { history.back(); } catch(e) { ignorePop = false; }
}
window.addEventListener("popstate", () => {
  if (ignorePop) {
    ignorePop = false;
    if (pendingPush || sheetOpen() || selMode) { pendingPush = false; guard = false; guardOn(); }
    return;
  }
  guard = false;
  if (sheetOpen()) { hideSheet(); render(); }
  else if (selMode) exitSelection();
  if (sheetOpen() || selMode) guardOn();
});
/* Appelé par Android quand on touche « retour » ; true = géré ici */
window.punchBack = () => {
  if (sheetOpen()) { hideSheet(); render(); return true; }
  if (selMode) { exitSelection(); return true; }
  if (current !== "punch") { go("punch"); return true; }
  return false;
};

/* ============ Export / sauvegarde ============ */
async function saveFile(name, text, mime){
  if (NATIVE) {
    try {
      const r = await FS.writeFile({ path: name, data: text, directory: "CACHE", encoding: "utf8" });
      await SHARE.share({ title: name, url: r.uri, dialogTitle: "Envoyer " + name });
    } catch(e) { if (!/cancel/i.test(e.message || "")) toast("Erreur : " + e.message); }
  } else {
    const a = document.createElement("a");
    a.href = URL.createObjectURL(new Blob([text], {type: mime}));
    a.download = name; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 2000);
  }
}
function exportCsv(){
  const list = (current === "history" ? filteredEntries() : S.entries).slice().sort((a,b) => a.start - b.start);
  if (!list.length) return toast("Rien à exporter");
  const num = n => (Math.round(n * 100) / 100).toFixed(2).replace(".", ",");
  const q = s => '"' + String(s ?? "").replace(/"/g, '""') + '"';
  const rows = [["Date","Client","Description des travaux","Début","Fin","Heures","Taux","Matériel","Total journée","Facturé","Payé"].map(q).join(";")];
  for (const e of list) rows.push([ymd(e.start), q(e.clientName), q(e.desc), hm(e.start), hm(e.end), num(hoursOf(e)), num(e.rate), num(e.material || 0), num(totalOf(e)), e.billed ? "Oui" : "Non", e.paid ? "Oui" : "Non"].join(";"));
  saveFile("punch-" + ymd(Date.now()) + ".csv", "﻿" + rows.join("\r\n"), "text/csv");
}

function applyBackup(d, ask){

  const hasData = S.clients.length || S.entries.length;

/* ============ Sauvegarde automatique (Documents/Punch) ============
   Le fichier reste sur le téléphone même si l'app est désinstallée. */
const AUTO_DIR = "Punch", AUTO_DEFAULT = "punch-sauvegarde.json";
let autoTimer = null, lastAutoBackup = null, autoBackupError = null;
function autoBackup(){
  if (!FS || (!S.clients.length && !S.entries.length)) return;   // ne jamais écraser une sauvegarde avec des données vides
  clearTimeout(autoTimer);
  autoTimer = setTimeout(writeAutoBackup, 2000);
}
async function writeAutoBackup(retry){
  const name = S.backupName || AUTO_DEFAULT;
  const data = JSON.stringify(Object.assign({}, S, { savedAt: Date.now(), app: "Punch" }));
  try {
    await FS.writeFile({ path: AUTO_DIR + "/" + name, data, directory: "DOCUMENTS", encoding: "utf8", recursive: true });
    lastAutoBackup = Date.now(); autoBackupError = null;
  } catch(e) {
    // Après une réinstallation, Android interdit de réécrire l'ancien fichier : on en crée un nouveau
    if (!retry) {
      S.backupName = "punch-sauvegarde-" + Date.now().toString(36) + ".json";
      try { localStorage.setItem(KEY, JSON.stringify(S)); } catch(x) {}
      return writeAutoBackup(true);
    }
    autoBackupError = e.message || String(e);
    return;
  }
  try {   // une copie par mois, au cas où
    const month = new Date().toISOString().slice(0, 7), suffix = name === AUTO_DEFAULT ? "" : "-" + name.slice(17, -5);
    await FS.writeFile({ path: AUTO_DIR + "/punch-" + month + suffix + ".json", data, directory: "DOCUMENTS", encoding: "utf8", recursive: true });
  } catch(e) {}
}
async function readBackupFile(name){
  try {
    const d = JSON.parse((await FS.readFile({ path: AUTO_DIR + "/" + name, directory: "DOCUMENTS", encoding: "utf8" })).data);
    return (Array.isArray(d.clients) && Array.isArray(d.entries) && (d.clients.length || d.entries.length)) ? d : null;
  } catch(e) { return null; }
}
/* Renvoie {data} si une sauvegarde est lisible, {listed:[noms]} si elle existe mais qu'Android en bloque la lecture */
async function findAutoBackup(){
  if (!FS) return null;
  let names = [AUTO_DEFAULT], listed = [];
  try {
    const r = await FS.readdir({ path: AUTO_DIR, directory: "DOCUMENTS" });
    listed = (r.files || []).map(f => typeof f === "string" ? f : f.name).filter(n => /^punch-.*\.json$/.test(n));
    names = [...new Set(names.concat(listed.filter(n => n.startsWith("punch-sauvegarde"))))];
  } catch(e) {}
  let best = null;
  for (const n of names) {   // la plus récente l'emporte
    const d = await readBackupFile(n);
    if (d && (!best || (d.savedAt || 0) > (best.savedAt || 0))) best = d;
  }
  if (best) return { data: best };
  return listed.length ? { listed } : null;
}
async function offerRestoreIfEmpty(){
  if (S.clients.length || S.entries.length) return false;

let permCache = null, startedServices = false;
const permsOk = st => !!(st && st.location && st.background && st.notifications && st.battery);
async function permStatus(){
  const st = { location: false, background: false, notifications: false, battery: false };
  if (!PN) return st;
  try { const p = await PN.checkPermissions(); st.location = p.location === "granted"; st.background = p.background === "granted"; } catch(e) {}
  try { st.notifications = (await LN.checkPermissions()).display === "granted"; } catch(e) {}
  try { st.battery = !!(await PN.batteryStatus()).unrestricted; } catch(e) {}
  return st;
}
async function openPerms(){

      ${row(st.location, "Position", "Détecter vos clients au punch IN")}
      ${row(st.background, "Position : « Toujours autoriser »", "Android surveille la zone de 2 km, app fermée")}
      ${row(st.notifications, "Notifications", "Rappels et « En service »")}

    </div>

      : `<button class="btn primary block" data-act="permsAll">Tout autoriser</button>
         <div class="actions"><button class="btn" data-act="permsLater">Plus tard</button><button class="btn" data-act="appSettings">Réglages Android</button></div>
         <div class="small muted" style="margin-top:10px">Si une fenêtre n'apparaît plus (refusée avant), utilisez « Réglages Android » › Autorisations.</div>`}
    ${!S.clients.length && !S.entries.length ? `<div style="margin-top:16px;padding-top:14px;border-top:1px solid var(--line)"><b>Vous aviez déjà Punch ?</b>

      <button class="btn block" style="margin-top:8px" data-act="restore">Restaurer une sauvegarde</button></div>` : ""}`, "perms");
}
async function requestAllPerms(){
  let st = await permStatus();
  if (!st.location) { try { await PN.requestPermissions({ permissions: ["location"] }); } catch(e) {} }
  if (!st.notifications) await notifReady();
  st = await permStatus();
  if (st.location && !st.background) {   // Android ouvre la page : choisir « Toujours autoriser »
    toast("Choisissez « Toujours autoriser », puis revenez", 6000);
    try { await PN.requestPermissions({ permissions: ["background"] }); } catch(e) {}
  }
  st = permCache = await permStatus();
  afterPerms();
  if (!st.battery) { try { await PN.requestBattery(); } catch(e) {} }   // la fiche se rafraîchit au retour
}
function afterPerms(){
  if (!startedServices) { startedServices = true; syncWatch(); currentPosition(); initNotifications(); applyZoneState(); syncClientFences(); }

      active: !!a, client: a ? a.clientName : "", start: a ? a.start : 0, startText: a ? hm(a.start) : "",
      defaultName: def ? "Par défaut : " + def.name : (S.clients.length ? "Choisir un client" : "Ajoutez un client"),
      todayText: todays.length ? "Aujourd'hui : " + dur(hrs * 3600000) + " · " + money(amt) : "Touchez IN pour commencer",
      clients: order.slice(0, 3).map(c => ({ id: c.id, name: c.name }))
    };
    PN.updateWidget({ data: JSON.stringify(data) }).catch(() => {});
  }, 300);
}
async function handleWidgetAction(a){
  if (!a || !a.op) return;
  if (current !== "punch") go("punch");
  if (a.op.startsWith("left")) {
    await applyZoneState();
    const act = S.active;
    if (!act) return;
    if (a.op === "leftOut") { punchOut(act.leftPending ? act.leftPending.at : Date.now()); return; }
    if (a.op === "leftTravel") { startTravel(60); return; }
    if (act.leftPending) askLeftZone();
    return;
  }
  if (a.op === "in") {
    if (S.active) return toast("Déjà en service chez " + S.active.clientName);
    if (!S.clients.length) return toast("Ajoutez d'abord un client");
    let id = a.clientId && clientById(a.clientId) ? a.clientId : null;
    if (!id) { await currentPosition(8000); id = suggestedClientId(); }
    punchIn(id);
  } else if (a.op === "out") {
    if (S.active) punchOut(Date.now()); else toast("Vous n'êtes pas en service");
  } else if (a.op === "pin") {
    ACT.pinWidget();
  }
}
function initWidgetBridge(){
  if (!PN) return;
  try { PN.addListener("widgetAction", handleWidgetAction); } catch(e) {}
  PN.getPendingAction().then(r => { if (r && r.action) handleWidgetAction(r.action); }).catch(() => {});
  syncWidget();
}

/* ============ Démarrage ============ */
document.addEventListener("visibilitychange", () => {
  syncWatch();
  if (document.visibilityState === "visible") {
    if (startedServices || !NATIVE) currentPosition();
    render();
    if (S.active && S.active.leftPending) askLeftZone();
    if (NATIVE && startedServices) applyZoneState();
    if (NATIVE) permStatus().then(st => { permCache = st; if (sheetKind === "perms") openPerms(); else if (current === "punch" && !sheetOpen()) renderPunch(true); });
  }
});
setInterval(() => { if (current === "punch" && S.active && !sheetOpen()) renderPunch(true); }, 30000);
/* App ouverte : vérifier ce qu'Android a détecté (lecture locale, aucun coût en batterie) */
setInterval(() => { if (NATIVE && startedServices && S.active && !S.active.leftPending && document.visibilityState === "visible") applyZoneState(); }, 15000);
if (!NATIVE && "serviceWorker" in navigator && location.protocol === "https:") navigator.serviceWorker.register("sw.js").catch(() => {});
render();
if (S.active && S.active.leftPending) askLeftZone();
if (NATIVE) {
  initWidgetBridge();
  offerRestoreIfEmpty().then(shown => permStatus().then(st => {
    permCache = st;
    if (permsOk(st) || S.setupSeen) afterPerms();
    if (!permsOk(st) && !S.setupSeen && !shown) { S.setupSeen = true; save(); if (!sheetOpen()) openPerms(); }
    else if (!sheetOpen()) render();
  }));
  autoBackup();
} else {
  syncWatch();
  currentPosition();
}
</script>
