name: Construire Punch

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Dépendances
        run: npm ci
      - name: Projet Android
        run: |
          npx cap add android
          npx @capacitor/assets generate --android --assetPath assets || echo "Icônes par défaut"
          bash scripts/android-strings.sh
          npx cap sync android
      - name: Clé de signature fixe (pour pouvoir mettre à jour sans désinstaller)
        run: mkdir -p ~/.android && cp keystore/debug.keystore ~/.android/debug.keystore
      - name: Compiler l'APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk ../Punch.apk
      - name: Publier dans « Releases »
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v$(date +%Y%m%d-%H%M)"
          gh release create "$TAG" Punch.apk --title "Punch $TAG" --notes "Téléchargez Punch.apk sur votre téléphone pour installer ou mettre à jour." --latest

  web:
    runs-on: ubuntu-latest
    continue-on-error: true   # ignoré tant que GitHub Pages n'est pas activé
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: www
      - id: deploy
        uses: actions/deploy-pages@v4
